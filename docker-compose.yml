services:
  lix-db:
    image: postgres:17.5-alpine
    container_name: lix-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - lix_db_data:/var/lib/postgresql/data
    networks:
      - lix-network

networks:
  lix-network:
    driver: bridge

volumes:
  lix_db_data:
